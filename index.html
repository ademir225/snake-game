<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O Reino Perdido</title>

<style>
body {
    margin: 0;
    background: #080b14;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

#jogo {
    max-width: 900px;
    margin: 20px auto;
}

h1 {
    color: #ffd700;
}

#status {
    background: #171d2e;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 15px;
}

#mapa {
    position: relative;
    width: 800px;
    max-width: 95vw;
    height: 500px;
    margin: auto;
    overflow: hidden;
    border: 4px solid #d4af37;
    border-radius: 12px;
    background:
        linear-gradient(45deg, #285c35 25%, #347344 25%,
        #347344 50%, #285c35 50%, #285c35 75%,
        #347344 75%);
    background-size: 80px 80px;
}

#jogador {
    position: absolute;
    width: 38px;
    height: 38px;
    background: #3498db;
    border: 3px solid white;
    border-radius: 50%;
    left: 80px;
    top: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 23px;
    z-index: 5;
}

.local {
    position: absolute;
    padding: 10px;
    background: #1b1b1b;
    border: 2px solid #ffd700;
    border-radius: 8px;
    color: white;
}

#vila {
    left: 40px;
    top: 40px;
}

#floresta {
    right: 40px;
    top: 60px;
}

#caverna {
    right: 50px;
    bottom: 50px;
}

#mensagem {
    min-height: 50px;
    padding: 15px;
    font-size: 18px;
}

.controles button {
    width: 55px;
    height: 45px;
    margin: 3px;
    font-size: 20px;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="jogo">

<h1>⚔️ O Reino Perdido ⚔️</h1>

<div id="status">
❤️ Vida: <span id="vida">100</span>
&nbsp;&nbsp;
⭐ XP: <span id="xp">0</span>
&nbsp;&nbsp;
💰 Ouro: <span id="ouro">0</span>
</div>

<div id="mapa">

    <div id="jogador">🧙</div>

    <div class="local" id="vila">
        🏰 Vila
    </div>

    <div class="local" id="floresta">
        🌲 Floresta
    </div>

    <div class="local" id="caverna">
        🕳️ Caverna
    </div>

</div>

<div class="controles">
    <button onclick="mover(0,-20)">⬆️</button><br>

    <button onclick="mover(-20,0)">⬅️</button>
    <button onclick="mover(0,20)">⬇️</button>
    <button onclick="mover(20,0)">➡️</button>
</div>

<div id="mensagem">
    🧙 Explore o reino! Use as setas do teclado para andar.
</div>

</div>

<script>

let x = 80;
let y = 220;

let vida = 100;
let xp = 0;
let ouro = 0;

function mover(dx, dy) {

    x += dx;
    y += dy;

    // Limites do mapa
    if (x < 0) x = 0;
    if (y < 0) y = 0;
    if (x > 755) x = 755;
    if (y > 455) y = 455;

    document.getElementById("jogador").style.left = x + "px";
    document.getElementById("jogador").style.top = y + "px";

    verificarLocal();
}

document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowUp") {
        mover(0,-20);
    }

    if (event.key === "ArrowDown") {
        mover(0,20);
    }

    if (event.key === "ArrowLeft") {
        mover(-20,0);
    }

    if (event.key === "ArrowRight") {
        mover(20,0);
    }

});

function verificarLocal() {

    if (x < 180 && y < 150) {

        document.getElementById("mensagem").innerHTML =
        "🏰 Você chegou à Vila de Eldor. " +
        "O ancião precisa falar com você.";

    }

    else if (x > 600 && y < 180) {

        document.getElementById("mensagem").innerHTML =
        "🌲 Você entrou na Floresta Sombria. " +
        "Cuidado com os monstros!";

    }

    else if (x > 600 && y > 350) {

        document.getElementById("mensagem").innerHTML =
        "🕳️ Você encontrou uma caverna misteriosa. " +
        "Talvez exista um tesouro lá dentro.";

    }

    else {

        document.getElementById("mensagem").innerHTML =
        "🗺️ Explore o reino e procure pistas sobre o Cristal de Eldor.";

    }

}

</script>

</body>
</html>
