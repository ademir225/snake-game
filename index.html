<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>O Reino Perdido</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #05070d;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

#jogo {
    max-width: 1000px;
    margin: auto;
    padding: 15px;
}

h1 {
    color: #ffd700;
    text-shadow: 0 0 15px #ff9900;
}

#status {
    background: #171c2c;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 15px;
    font-size: 18px;
}

/* MUNDO */

#mapa {
    position: relative;
    width: 900px;
    max-width: 95vw;
    height: 520px;
    margin: auto;
    overflow: hidden;

    background:
        radial-gradient(circle at 50% 40%, #477b42, #18351d);

    border: 4px solid #b8860b;
    border-radius: 15px;

    box-shadow:
        inset 0 0 80px #000,
        0 0 30px #b8860b;

    perspective: 700px;
}

/* chão com efeito de profundidade */

#chao {
    position: absolute;
    width: 100%;
    height: 100%;

    background:
        repeating-linear-gradient(
            90deg,
            rgba(255,255,255,.03) 0px,
            rgba(255,255,255,.03) 2px,
            transparent 2px,
            transparent 60px
        );

    transform: rotateX(5deg);
}

/* PERSONAGEM */

#jogador {
    position: absolute;

    width: 50px;
    height: 65px;

    left: 420px;
    top: 350px;

    font-size: 45px;

    filter: drop-shadow(0 12px 5px rgba(0,0,0,.7));

    transition: .15s;

    z-index: 10;
}

/* MONSTRO */

#monstro {
    position: absolute;

    width: 60px;
    height: 70px;

    left: 650px;
    top: 180px;

    font-size: 55px;

    filter:
        drop-shadow(0 12px 5px rgba(0,0,0,.8))
        drop-shadow(0 0 10px red);

    z-index: 9;
}

/* LOCAIS */

.local {
    position: absolute;

    padding: 12px;

    background: rgba(0,0,0,.65);

    border: 2px solid #ffd700;

    border-radius: 10px;

    box-shadow: 0 8px 15px rgba(0,0,0,.5);

    font-weight: bold;
}

#vila {
    left: 40px;
    top: 50px;
}

#floresta {
    right: 40px;
    top: 50px;
}

#caverna {
    right: 50px;
    bottom: 40px;
}

/* BARRA DO MONSTRO */

#barraMonstro {
    position: absolute;

    left: 620px;
    top: 150px;

    width: 120px;
    height: 12px;

    background: #333;

    border: 2px solid white;

    border-radius: 10px;

    overflow: hidden;

    z-index: 11;
}

#vidaMonstro {
    width: 100%;
    height: 100%;

    background: red;
}

/* MENSAGEM */

#mensagem {
    min-height: 60px;

    padding: 15px;

    font-size: 18px;

    line-height: 1.5;
}

/* CONTROLES */

button {
    padding: 12px 18px;

    margin: 4px;

    border: none;

    border-radius: 8px;

    background: #d4af37;

    color: #111;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 5px 0 #806000;
}

button:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #806000;
}

.controles {
    margin-top: 10px;
}

</style>
</head>

<body>

<div id="jogo">

<h1>⚔️ O REINO PERDIDO ⚔️</h1>

<div id="status">

❤️ Vida: <span id="vida">100</span>

&nbsp;&nbsp;

⭐ XP: <span id="xp">0</span>

&nbsp;&nbsp;

💰 Ouro: <span id="ouro">0</span>

</div>

<div id="mapa">

<div id="chao"></div>

<div class="local" id="vila">
🏰 Vila de Eldor
</div>

<div class="local" id="floresta">
🌲 Floresta
</div>

<div class="local" id="caverna">
🕳️ Caverna
</div>

<div id="jogador">
🧙
</div>

<div id="barraMonstro">
<div id="vidaMonstro"></div>
</div>

<div id="monstro">
👹
</div>

</div>

<div class="controles">

<button onclick="mover(0,-25)">⬆️</button>

<br>

<button onclick="mover(-25,0)">⬅️</button>

<button onclick="mover(0,25)">⬇️</button>

<button onclick="mover(25,0)">➡️</button>

</div>

<div>

<button onclick="atacar()">
⚔️ ATACAR
</button>

<button onclick="explorar()">
🌲 EXPLORAR
</button>

</div>

<div id="mensagem">

👹 Um monstro apareceu na floresta!
<br>
Use as setas para se aproximar e ataque.

</div>

</div>

<script>

let x = 420;
let y = 350;

let vida = 100;
let xp = 0;
let ouro = 0;

let vidaMonstro = 100;

function mover(dx, dy) {

    x += dx;
    y += dy;

    if (x < 10) x = 10;
    if (y < 10) y = 10;

    if (x > 840) x = 840;
    if (y > 450) y = 450;

    document.getElementById("jogador").style.left =
        x + "px";

    document.getElementById("jogador").style.top =
        y + "px";

    verificarDistancia();

}

document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowUp") {
        mover(0,-25);
    }

    if (event.key === "ArrowDown") {
        mover(0,25);
    }

    if (event.key === "ArrowLeft") {
        mover(-25,0);
    }

    if (event.key === "ArrowRight") {
        mover(25,0);
    }

});

function verificarDistancia() {

    let mx = 650;
    let my = 180;

    let distancia =
        Math.sqrt(
            Math.pow(x - mx, 2) +
            Math.pow(y - my, 2)
        );

    if (distancia < 130) {

        document.getElementById("mensagem").innerHTML =
        "👹 Você está perto do monstro! " +
        "Clique em ⚔️ ATACAR para lutar!";

    }

}

function atacar() {

    let mx = 650;
    let my = 180;

    let distancia =
        Math.sqrt(
            Math.pow(x - mx, 2) +
            Math.pow(y - my, 2)
        );

    if (distancia > 150) {

        document.getElementById("mensagem").innerHTML =
        "⚠️ Você está muito longe! " +
        "Aproxime-se do monstro.";

        return;
    }

    if (vidaMonstro <= 0) {

        document.getElementById("mensagem").innerHTML =
        "🏆 Você já derrotou este monstro!";

        return;
    }

    let dano = Math.floor(Math.random() * 20) + 10;

    vidaMonstro -= dano;

    if (vidaMonstro < 0) {
        vidaMonstro = 0;
    }

    document.getElementById("vidaMonstro").style.width =
        vidaMonstro + "%";

    if (vidaMonstro <= 0) {

        xp += 50;
        ouro += 25;

        document.getElementById("monstro").innerHTML = "💀";

        document.getElementById("mensagem").innerHTML =
        "🏆 VITÓRIA! Você derrotou o monstro! " +
        "Ganhou ⭐ 50 XP e 💰 25 moedas.";

    } else {

        let danoInimigo =
            Math.floor(Math.random() * 10) + 5;

        vida -= danoInimigo;

        if (vida < 0) {
            vida = 0;
        }

        document.getElementById("mensagem").innerHTML =
        "⚔️ Você causou " + dano +
        " de dano!<br>" +
        "👹 O monstro causou " +
        danoInimigo + " de dano em você.";

    }

    atualizar();

}

function explorar() {

    document.getElementById("mensagem").innerHTML =
    "🌲 Você está explorando a floresta. " +
    "Talvez exista uma pista sobre o Cristal de Eldor...";

}

function atualizar() {

    document.getElementById("vida").textContent = vida;

    document.getElementById("xp").textContent = xp;

    document.getElementById("ouro").textContent = ouro;

}

</script>

</body>
</html>
