<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O Reino Perdido - Terror</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
}

#jogo {
    width: 100vw;
    height: 100vh;
    position: relative;
    background:
        radial-gradient(circle at 50% 45%,
        #596451 0%,
        #263028 25%,
        #101510 55%,
        #020302 100%);
}

/* efeito de profundidade */
#chao {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 55%;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,0),
            #050605
        ),
        repeating-linear-gradient(
            90deg,
            #151b16 0px,
            #151b16 40px,
            #101510 42px,
            #101510 80px
        );

    transform: perspective(500px) rotateX(35deg);
    transform-origin: bottom;
}

/* árvores */
.arvore {
    position: absolute;
    font-size: 90px;
    filter: brightness(.35) drop-shadow(0 10px 10px black);
}

.a1 { left: 5%; top: 25%; }
.a2 { left: 20%; top: 18%; }
.a3 { right: 10%; top: 20%; }
.a4 { right: 25%; top: 15%; }

/* HUD */
#hud {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 20;

    background: rgba(0,0,0,.65);
    border: 1px solid #777;
    border-radius: 8px;

    padding: 12px;

    box-shadow: 0 0 15px black;
}

/* mira */
#mira {
    position: absolute;
    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    font-size: 28px;

    z-index: 20;

    color: white;
    text-shadow: 0 0 5px black;
}

/* lanterna */
#lanterna {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 700px;
    height: 500px;

    transform: translate(-50%, -50%);

    background:
        radial-gradient(
            ellipse,
            rgba(255,255,220,.22) 0%,
            rgba(255,255,220,.08) 25%,
            rgba(0,0,0,.75) 65%,
            rgba(0,0,0,.96) 100%
        );

    pointer-events: none;

    z-index: 10;
}

/* monstro */
#monstro {
    position: absolute;

    left: 68%;
    top: 42%;

    font-size: 80px;

    filter:
        brightness(.45)
        drop-shadow(0 15px 10px black)
        drop-shadow(0 0 15px darkred);

    z-index: 5;

    animation: respirar 2s infinite;
}

@keyframes respirar {
    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.04);
    }
}

/* mensagem */
#mensagem {
    position: absolute;

    bottom: 90px;
    left: 50%;

    transform: translateX(-50%);

    width: 80%;

    text-align: center;

    background: rgba(0,0,0,.7);

    padding: 15px;

    border-radius: 8px;

    z-index: 20;
}

/* controles */
#controles {
    position: absolute;

    bottom: 20px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 30;

    text-align: center;
}

button {
    background: #222;
    color: white;

    border: 1px solid #888;

    border-radius: 6px;

    padding: 12px 18px;

    margin: 3px;

    cursor: pointer;

    font-size: 16px;
}

button:hover {
    background: #444;
}

#perigo {
    color: #ff4444;
}
</style>
</head>

<body>

<div id="jogo">

    <div id="chao"></div>

    <div class="arvore a1">🌲</div>
    <div class="arvore a2">🌲</div>
    <div class="arvore a3">🌲</div>
    <div class="arvore a4">🌲</div>

    <div id="hud">
        ❤️ Vida: <span id="vida">100</span><br>
        🔦 Lanterna: ligada<br>
        🎒 Munição: <span id="municao">12</span>
    </div>

    <div id="mira">+</div>

    <div id="lanterna"></div>

    <div id="monstro">👹</div>

    <div id="mensagem">
        🌑 Você acordou sozinho em uma floresta desconhecida.
        <br>
        Há alguma coisa observando você...
    </div>

    <div id="controles">

        <button onclick="andar('frente')">⬆️ Andar</button>

        <button onclick="atirar()">🔫 Atirar</button>

        <button onclick="lanterna()">🔦 Lanterna</button>

    </div>

</div>

<script>

let vida = 100;
let municao = 12;
let luz = true;

function atirar() {

    if (municao <= 0) {

        document.getElementById("mensagem").innerHTML =
        "🔫 Sem munição! Você precisa encontrar mais.";

        return;
    }

    municao--;

    document.getElementById("municao").textContent =
        municao;

    document.getElementById("mensagem").innerHTML =
        "💥 DISPARO! O som ecoou pela floresta...";

    if (municao === 0) {

        document.getElementById("mensagem").innerHTML +=
        "<br>⚠️ Sua munição acabou.";

    }

}

function andar(direcao) {

    document.getElementById("mensagem").innerHTML =
        "👣 Você avançou pela floresta...";

}

function lanterna() {

    luz = !luz;

    const elemento =
        document.getElementById("lanterna");

    if (luz) {

        elemento.style.opacity = "1";

        document.getElementById("mensagem").innerHTML =
            "🔦 A lanterna foi ligada.";

    } else {

        elemento.style.opacity = ".15";

        document.getElementById("mensagem").innerHTML =
            "🌑 A lanterna foi desligada...";

    }

}

</script>

</body>
</html>
